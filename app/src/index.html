<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src ipc: http://ipc.localhost https://query.wikidata.org; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<title>登記</title>
<link rel="stylesheet" href="kotoba-client-consent.css">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="bar">
  <h1>登記</h1>
  <button id="new" type="button">新しい記録</button>
</header>
<p class="notice">土地・建物の権利を、この端末の中だけに控えておくアプリです。公式の登記ではなく、登記所への申請や代金の受け渡しもしません。</p>
<main class="layout">
  <section class="list" aria-labelledby="list-title">
    <h2 id="list-title">記録</h2>
    <ul id="list"></ul>
    <p id="empty" class="muted" hidden>まだ記録がありません。「新しい記録」から作成します。</p>
    <p id="storage" class="muted" role="status"></p>
  </section>
  <section id="detail" class="detail" aria-live="polite"></section>
</main>
<footer class="foot">
  <p class="muted">法域の情報: cloud-itonami-isic-6810 <code>realty.facts</code>（<span id="facts-count"></span>）。照会: Wikidata（CC0）。<span id="env"></span></p>
</footer>
</body>
</html>
